# Every push to main is checked, then deployed to Cloudflare Workers.
# Needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable on the repo.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manyfold-penny-production
  cancel-in-progress: false

env:
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://manyfold-penny.netmind-ai.workers.dev' }}

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build and dry-run the Worker
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$PRODUCTION_URL/api/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed at $PRODUCTION_URL/api/health" >&2
          exit 1
